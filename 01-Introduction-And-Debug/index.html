<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="song-card" id="current-track">
        <img src="cover.jpg" alt="Cover Art">
        <div class="song-info">
            <h3>Bohemian Rhapsody</h3>
            <p>Queen</p>
        </div>
        <button class="btn-play">Play</button>
    </div>

    <div class="container mt-5"> 
        <div class="row">
            <div class="col-md-6 col-sm-12"> 
                <div class="song-card">
                    <h3>Song 1</h3>
                    <button class="btn btn-primary">Play</button>
                </div>
            </div>
            <div class="col-md-6 col-sm-12">
                <div class="song-card">
                    <h3>Song 2</h3>
                    <button class="btn btn-success">Play</button>
                </div>
            </div>
        </div>
    </div>

    <table class="playlist-table">
    <thead>
        <tr>
            <th>#</th>
            <th>Title</th>
            <th>Artist</th>
        </tr>
    </thead>
    <tbody>
        <tr><td>1</td><td>Bohemian Rhapsody</td><td>Queen</td></tr>
        <tr><td>2</td><td>Imagine</td><td>John Lennon</td></tr>
        <tr><td>3</td><td>Hotel California</td><td>Eagles</td></tr>
    </tbody>
</table>

    <script src="js/app.js"></script>
</body>
</html>
