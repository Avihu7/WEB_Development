<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <h2>התחברות</h2>

    <form id="loginForm" class="auth-form">
        <div class="form-group">
            <label for="username">שם משתמש</label>
            <input type="text" id="username" name="username" placeholder="שם משתמש" required>
        </div>

        <div class="form-group">
            <label for="password">סיסמה</label>
            <input type="password" id="password" name="password" placeholder="סיסמה" required>
        </div>

        <button type="submit">התחבר</button>
    </form>

    <p class="auth-link">אין לך חשבון? <a href="register.html">הרשמה</a></p>
</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
