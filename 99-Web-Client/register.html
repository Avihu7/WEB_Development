<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>הרשמה</h2>

<form id="registerForm">
    <input type="text" placeholder="שם משתמש" required>
    <input type="email" placeholder="אימייל" required>
    <input type="number" placeholder="גיל" required>
    <input type="password" placeholder="סיסמה" required>
    <input type="password" placeholder="אימות סיסמה" required>
    <input type="url" placeholder="קישור לתמונה">
    <button type="submit">הרשמה</button>
</form>

<p>
    כבר רשום?
    <a href="login.html">התחבר</a>
</p>

<script src="js/auth.js"></script>
<script src="js/storage.js"></script>

</body>
</html>
