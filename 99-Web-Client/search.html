<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1 id="welcome"></h1>
</header>

<main>

    <!-- חיפוש -->
    <section id="searchSection">
        <input type="text" id="searchInput" placeholder="חפש סרטון או זמר">
        <button id="searchBtn">חפש</button>
    </section>

    <!-- תוצאות -->
    <section id="results" class="results-grid">
        <!-- כרטיסיות סרטונים -->
    </section>

</main>

<!-- Modal ניגון -->
<div id="videoModal" class="modal hidden">
    <div class="modal-content">
        <span id="closeModal">×</span>
        <iframe id="videoFrame" width="560" height="315" allowfullscreen></iframe>
    </div>
</div>

<!-- Modal הוספה למועדפים -->
<div id="favoriteModal" class="modal hidden">
    <div class="modal-content">
        <h3>הוספה למועדפים</h3>

        <label>בחר Playlist קיים:</label>
        <select id="playlistSelect"></select>

        <p>או</p>

        <button id="createPlaylistBtn">צור Playlist חדש</button>

        <br><br>
        <button id="confirmAddBtn">הוסף</button>
        <button id="cancelAddBtn">ביטול</button>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden">
    הסרטון נוסף לרשימה
    <a href="playlists.html">מעבר מהיר</a>
</div>

<script src="js/storage.js"></script>
<script src="js/search.js"></script>

</body>
</html>
