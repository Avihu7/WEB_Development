<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>Playlists</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>הספרייה שלי</h1>
</header>

<div class="container">

    <!-- Sidebar -->
    <aside>
        <h3>הספרייה שלי</h3>
        <button id="newPlaylistBtn">+ פלייליסט חדש</button>
        <ul id="playlistList">
            <!-- שמות הפלייליסטים -->
        </ul>
    </aside>

    <!-- Main Content -->
    <main>
        <h3 id="playlistTitle">בחר פלייליסט מהרשימה</h3>

        <!-- חיפוש פנימי -->
        <input type="text" id="filterInput" placeholder="חפש סרטון לפי שם">

        <!-- מיון -->
        <select id="sortSelect">
            <option value="az">מיון א-ב</option>
            <option value="za">מיון ב-א</option>
        </select>

        <div id="videos">
            <!-- סרטונים של הפלייליסט -->
        </div>
    </main>

</div>

<script src="js/storage.js"></script>
<script src="js/playlists.js"></script>

</body>
</html>
